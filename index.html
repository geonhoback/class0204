<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 학사 일정 & 프린트 캘린더</title>
  <style>
    :root {
      --exam-color: #e74c3c;
      --exam-bg: #fde8e8;
      --task-color: #2b7bc6;
      --task-bg: #e8f4fd;
      --primary: #4a90e2;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #edf0f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #333;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      background-color: #e3f2fd;
      color: #1976d2;
    }

    .refresh-btn {
      background: none;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .refresh-btn:hover { background-color: #f1f3f5; }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 16px;
      color: #2c3e50;
    }

    /* 달력 헤더 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .calendar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
    }

    .nav-btn {
      background: #eef2f7;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* 요일 그리드 */
    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-bottom: 6px;
    }

    .weekdays-grid div:first-child { color: #e74c3c; }
    .weekdays-grid div:last-child { color: #3498db; }

    /* 달력 격자 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }

    /* 칸 크기 고정 (76px) */
    .day-cell {
      height: 76px;
      max-height: 76px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .day-cell:hover { background: #f4f8fc; }
    .day-cell.empty { border: none; background: transparent; cursor: default; }
    .day-cell.today { border-color: var(--primary); background-color: #f0f7ff; }

    .day-number {
      font-size: 0.72rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .event-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      scrollbar-width: none;
    }
    .event-container::-webkit-scrollbar { display: none; }

    .event-badge {
      font-size: 0.58rem;
      padding: 1px 3px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      display: block;
      flex-shrink: 0;
    }

    .event-badge.task {
      background: var(--task-bg);
      color: var(--task-color);
      border-left: 2.5px solid var(--task-color);
    }

    .event-badge.exam {
      background: var(--exam-bg);
      color: var(--exam-color);
      border-left: 2.5px solid var(--exam-color);
    }

    .legend {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.8rem;
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 18px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .modal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 12px 0;
    }

    .modal-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .print-img-thumb {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      margin-top: 6px;
      cursor: zoom-in;
      display: block;
      object-fit: cover;
    }

    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 12px;
    }

    .lightbox-overlay.active { display: flex; }
    .lightbox-img { max-width: 95%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <span class="status-badge">GitHub 실시간 연동</span>
    <button class="refresh-btn" onclick="loadDataFromGitHub()">🔄 최신 일정 불러오기</button>
  </div>

  <h1>🗓️ 2학년 일정 & 프린트 캘린더</h1>

  <!-- 달력 헤더 -->
  <div class="calendar-header">
    <button class="nav-btn" onclick="prevMonth()">◀</button>
    <h2 id="monthYearDisplay"></h2>
    <button class="nav-btn" onclick="nextMonth()">▶</button>
  </div>

  <div class="weekdays-grid">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>

  <div class="days-grid" id="daysContainer"></div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--task-color);"></span>
      <span>[수] 수행평가</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--exam-color);"></span>
      <span>[지] 지필고사</span>
    </div>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalDateTitle">상세 일정</h3>
    <ul class="modal-list" id="modalList"></ul>
    <button style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="closeModal()">닫기</button>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" class="lightbox-img" src="" alt="유인물 확대">
</div>

<script>
  // ========================================================
  // [필수 입력] 본인의 실제 GitHub 아이디와 저장소 이름
  // ========================================================
  const GITHUB_USERNAME = "본인의_깃허브_아이디";
  const GITHUB_REPO = "본인의_저장소_이름";
  const DATA_FILE_PATH = "data.json";

  let schedules = [];
  let currentDate = new Date();
  let selectedDateForModal = null;

  // GitHub 저장소의 raw 주소에서 data.json 읽어오기 (토큰 전혀 필요 없음)
  async function loadDataFromGitHub() {
    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${DATA_FILE_PATH}?t=${Date.now()}`;
    try {
      const res = await fetch(rawUrl);
      if (!res.ok) throw new Error("데이터를 가져오지 못했습니다.");
      
      schedules = await res.json();
      renderCalendar();
      if (selectedDateForModal) openModal(selectedDateForModal);
    } catch (e) {
      console.warn("데이터 로드 오류:", e);
    }
  }

  // 달력 렌더링
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYearDisplay').innerText = `${year}년 ${month + 1}월`;

    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysContainer.appendChild(emptyCell);
    }

    const todayStr = new Date().toISOString().split('T')[0];

    for (let day = 1; day <= totalDays; day++) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';

      const formattedMonth = String(month + 1).padStart(2, '0');
      const formattedDay = String(day).padStart(2, '0');
      const dateString = `${year}-${formattedMonth}-${formattedDay}`;

      if (dateString === todayStr) dayCell.classList.add('today');

      const dayNumber = document.createElement('div');
      dayNumber.className = 'day-number';
      dayNumber.innerText = day;
      dayCell.appendChild(dayNumber);

      const eventContainer = document.createElement('div');
      eventContainer.className = 'event-container';

      const dayEvents = schedules.filter(s => s.date === dateString);

      dayEvents.forEach(evt => {
        const badge = document.createElement('div');
        badge.className = `event-badge ${evt.type}`;
        const typePrefix = evt.type === 'exam' ? '[지]' : '[수]';
        badge.innerText = `${typePrefix} ${evt.title}`;
        eventContainer.appendChild(badge);
      });

      dayCell.appendChild(eventContainer);
      dayCell.onclick = () => openModal(dateString);
      daysContainer.appendChild(dayCell);
    }
  }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  // 상세 모달
  function openModal(dateString) {
    selectedDateForModal = dateString;
    const dayEvents = schedules.filter(s => s.date === dateString);
    if (!dayEvents || dayEvents.length === 0) return;

    document.getElementById('modalDateTitle').innerText = `${dateString} 일정 및 유인물`;
    const list = document.getElementById('modalList');
    list.innerHTML = '';

    dayEvents.forEach(evt => {
      const li = document.createElement('li');
      li.className = 'modal-item';
      const label = evt.type === 'exam' ? '[지필고사]' : '[수행평가]';
      const photoHtml = evt.imageData ? `<img src="${evt.imageData}" class="print-img-thumb" onclick="openLightbox('${evt.imageData}')">` : '';

      li.innerHTML = `
        <div style="font-weight:bold; margin-bottom:4px;">
          <span>${label} ${evt.title}</span>
        </div>
        ${photoHtml}
      `;
      list.appendChild(li);
    });

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('active');
    selectedDateForModal = null;
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxOverlay').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightboxOverlay').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
  }

  // 시작 시 달력 격자 그리고 GitHub 데이터 호출
  renderCalendar();
  loadDataFromGitHub();
</script>
</body>
</html>
