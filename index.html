<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 학사 일정 & 프린트 알리미</title>
  <style>
    :root {
      --exam-color: #e74c3c;
      --exam-bg: #fde8e8;
      --task-color: #2b7bc6;
      --task-bg: #e8f4fd;
      --primary: #4a90e2;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #edf0f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #333;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 16px;
    }

    /* 상단 상태 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .user-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .user-badge.student {
      background-color: #e9ecef;
      color: #495057;
    }
    .user-badge.admin {
      background-color: #e3f2fd;
      color: #1976d2;
    }

    .auth-btn {
      background: none;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-btn:hover {
      background-color: #f1f3f5;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 16px;
      color: #2c3e50;
    }

    /* 관리자 입력 폼 */
    .form-box {
      display: none;
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      flex-direction: column;
      gap: 8px;
    }

    .form-box.active {
      display: flex;
    }

    .form-row {
      display: flex;
      gap: 6px;
    }

    input, select, button {
      padding: 9px 10px;
      font-size: 0.9rem;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #555;
    }

    .file-input-wrapper input[type="file"] {
      padding: 4px;
      font-size: 0.8rem;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      padding: 10px;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: #357abd;
    }

    /* 캘린더 네비게이션 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .calendar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
    }

    .nav-btn {
      background: #eef2f7;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* 요일 표시 */
    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-bottom: 6px;
    }

    .weekdays-grid div:first-child { color: #e74c3c; } /* 일요일 */
    .weekdays-grid div:last-child { color: #3498db; }  /* 토요일 */

    /* 날짜 그리드 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      min-height: 72px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background 0.15s;
    }

    .day-cell:hover {
      background: #f4f8fc;
    }

    .day-cell.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .day-cell.today {
      border-color: var(--primary);
      background-color: #f0f7ff;
    }

    .day-number {
      font-size: 0.75rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 3px;
    }

    /* 컴팩트해진 일정 뱃지 */
    .event-badge {
      font-size: 0.62rem;
      padding: 2px 3px;
      border-radius: 3px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* 글자가 넘치면 말줄임표 처리 */
      line-height: 1.2;
      display: block;
    }

    .event-badge.task {
      background: var(--task-bg);
      color: var(--task-color);
      border-left: 2.5px solid var(--task-color);
    }

    .event-badge.exam {
      background: var(--exam-bg);
      color: var(--exam-color);
      border-left: 2.5px solid var(--exam-color);
    }

    /* 하단 범례 */
    .legend {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .modal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-item-title {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .modal-img-container {
      margin-top: 4px;
    }

    .print-img-thumb {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      border: 1px solid #ddd;
      cursor: zoom-in;
      object-fit: cover;
      display: block;
    }

    .img-caption {
      font-size: 0.75rem;
      color: #777;
      margin-top: 4px;
    }

    .delete-btn {
      border: none;
      background: none;
      color: #aaa;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      color: var(--exam-color);
    }

    /* 라이트박스 */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 12px;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 95%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <span id="roleBadge" class="user-badge student">학생 모드</span>
    <button id="authBtn" class="auth-btn" onclick="toggleAuthModal()">관리자 로그인</button>
  </div>

  <h1>🗓️ 2학년 일정 & 프린트 캘린더</h1>

  <!-- 관리자 일정 등록 폼 -->
  <div class="form-box" id="adminFormBox">
    <div class="form-row">
      <select id="typeSelect">
        <option value="task">수행</option>
        <option value="exam">지필</option>
      </select>
      <input type="text" id="titleInput" placeholder="과목명 (예: 국어, 역사, 과학)">
    </div>
    <div class="form-row">
      <input type="date" id="dateInput" style="flex:1;">
    </div>
    <div class="file-input-wrapper">
      <span>📄 유인물 사진:</span>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <button class="btn-primary" onclick="addSchedule()">일정 및 사진 등록</button>
  </div>

  <!-- 캘린더 네비게이션 -->
  <div class="calendar-header">
    <button class="nav-btn" onclick="prevMonth()">◀</button>
    <h2 id="monthYearDisplay"></h2>
    <button class="nav-btn" onclick="nextMonth()">▶</button>
  </div>

  <!-- 요일 헤더 -->
  <div class="weekdays-grid">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>

  <!-- 달력 그리드 -->
  <div class="days-grid" id="daysContainer"></div>

  <!-- 하단 안내 범례 (수, 지로 축약 표기) -->
  <div class="legend">
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--task-color);"></span>
      <span>[수] 수행평가</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--exam-color);"></span>
      <span>[지] 지필고사</span>
    </div>
  </div>
</div>

<!-- 상세 보기 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalDateTitle">상세 일정</h3>
    <ul class="modal-list" id="modalList"></ul>
    <button class="btn-primary" style="width:100%;" onclick="closeModal()">닫기</button>
  </div>
</div>

<!-- 관리자 인증 모달 -->
<div class="modal-overlay" id="authModalOverlay" onclick="closeAuthModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3>🔒 관리자 로그인</h3>
    <p style="font-size:0.85rem; color:#666; margin-bottom:12px;">
      회장 또는 선생님 전용 암호를 입력해 주세요.
    </p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="password" id="adminPasswordInput" placeholder="관리자 비밀번호">
      <button class="btn-primary" onclick="loginAdmin()">로그인</button>
      <button class="auth-btn" style="padding:8px;" onclick="closeAuthModal()">취소</button>
    </div>
  </div>
</div>

<!-- 라이트박스 (사진 확대) -->
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" class="lightbox-img" src="" alt="확대된 프린트 사진">
</div>

<script>
  const ADMIN_PASSWORD = "class2026"; 
  const STORAGE_KEY = 'class_calendar_schedules_v2';

  let currentUserRole = sessionStorage.getItem('user_role') || 'student';

  // 기본 과목명 중심 데이터 샘플
  let schedules = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { id: 1, type: 'task', title: '역사', date: '2026-09-24', imageData: null },
    { id: 2, type: 'exam', title: '수학', date: '2026-09-30', imageData: null }
  ];

  let currentDate = new Date();
  let selectedDateForModal = null;

  function updateAuthUI() {
    const roleBadge = document.getElementById('roleBadge');
    const authBtn = document.getElementById('authBtn');
    const adminFormBox = document.getElementById('adminFormBox');

    if (currentUserRole === 'admin') {
      roleBadge.innerText = '👑 관리자 모드';
      roleBadge.className = 'user-badge admin';
      authBtn.innerText = '로그아웃';
      authBtn.onclick = logoutAdmin;
      adminFormBox.classList.add('active');
    } else {
      roleBadge.innerText = '👤 학생 모드';
      roleBadge.className = 'user-badge student';
      authBtn.innerText = '관리자 로그인';
      authBtn.onclick = openAuthModal;
      adminFormBox.classList.remove('active');
    }
  }

  function openAuthModal() {
    document.getElementById('adminPasswordInput').value = '';
    document.getElementById('authModalOverlay').classList.add('active');
  }

  function closeAuthModal(e) {
    if (e && e.target !== document.getElementById('authModalOverlay')) return;
    document.getElementById('authModalOverlay').classList.remove('active');
  }

  function loginAdmin() {
    const enteredPassword = document.getElementById('adminPasswordInput').value;
    if (enteredPassword === ADMIN_PASSWORD) {
      currentUserRole = 'admin';
      sessionStorage.setItem('user_role', 'admin');
      updateAuthUI();
      closeAuthModal();
      renderCalendar();
      alert('관리자(회장/선생님)로 로그인되었습니다.');
    } else {
      alert('비밀번호가 일치하지 않습니다.');
    }
  }

  function logoutAdmin() {
    currentUserRole = 'student';
    sessionStorage.removeItem('user_role');
    updateAuthUI();
    renderCalendar();
    alert('학생 모드로 전환되었습니다.');
  }

  // 캘린더 렌더링
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYearDisplay').innerText = `${year}년 ${month + 1}월`;

    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysContainer.appendChild(emptyCell);
    }

    const todayStr = new Date().toISOString().split('T')[0];

    for (let day = 1; day <= totalDays; day++) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';

      const formattedMonth = String(month + 1).padStart(2, '0');
      const formattedDay = String(day).padStart(2, '0');
      const dateString = `${year}-${formattedMonth}-${formattedDay}`;

      if (dateString === todayStr) {
        dayCell.classList.add('today');
      }

      const dayNumber = document.createElement('div');
      dayNumber.className = 'day-number';
      dayNumber.innerText = day;
      dayCell.appendChild(dayNumber);

      const dayEvents = schedules.filter(s => s.date === dateString);

      dayEvents.forEach(evt => {
        const badge = document.createElement('div');
        badge.className = `event-badge ${evt.type}`;
        
        // 핵심 변경 지점: [수], [지] 한 글자로 축약하여 화면 잘림 방지
        const typePrefix = evt.type === 'exam' ? '[지]' : '[수]';
        const photoIcon = evt.imageData ? ' 📷' : '';
        badge.innerText = `${typePrefix} ${evt.title}${photoIcon}`;
        
        dayCell.appendChild(badge);
      });

      dayCell.onclick = () => openModal(dateString);

      daysContainer.appendChild(dayCell);
    }
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  function addSchedule() {
    if (currentUserRole !== 'admin') {
      alert('일정 등록 권한이 없습니다.');
      return;
    }

    const type = document.getElementById('typeSelect').value;
    const title = document.getElementById('titleInput').value.trim();
    const date = document.getElementById('dateInput').value;
    const imageFileInput = document.getElementById('imageInput');
    const imageFile = imageFileInput.files[0];

    if (!title || !date) {
      alert('과목명을 입력하고 날짜를 선택해 주세요!');
      return;
    }

    if (imageFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveNewItem(type, title, date, e.target.result);
      };
      reader.readAsDataURL(imageFile);
    } else {
      saveNewItem(type, title, date, null);
    }
  }

  function saveNewItem(type, title, date, imageData) {
    const newSchedule = {
      id: Date.now(),
      type: type,
      title: title,
      date: date,
      imageData: imageData
    };

    try {
      schedules.push(newSchedule);
      saveAndRender();
      
      document.getElementById('titleInput').value = '';
      document.getElementById('dateInput').value = '';
      document.getElementById('imageInput').value = '';
      alert('일정이 성공적으로 등록되었습니다.');
    } catch (e) {
      alert('이미지 용량이 너무 큽니다. 더 작은 용량의 이미지를 사용해 주세요.');
      schedules.pop();
    }
  }

  function deleteSchedule(id) {
    if (currentUserRole !== 'admin') {
      alert('삭제 권한이 없습니다.');
      return;
    }

    if (!confirm('정말 이 일정을 삭제하시겠습니까?')) return;

    schedules = schedules.filter(s => s.id !== id);
    saveAndRender();

    if (selectedDateForModal) {
      const remainingEvents = schedules.filter(s => s.date === selectedDateForModal);
      if (remainingEvents.length === 0) {
        closeModal();
      } else {
        openModal(selectedDateForModal);
      }
    }
  }

  function saveAndRender() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
    renderCalendar();
  }

  // 상세 보기 모달에서는 친절하게 풀네임 표기
  function openModal(dateString) {
    selectedDateForModal = dateString;
    const dayEvents = schedules.filter(s => s.date === dateString);

    if (!dayEvents || dayEvents.length === 0) return;

    document.getElementById('modalDateTitle').innerText = `${dateString} 일정 및 유인물`;
    const list = document.getElementById('modalList');
    list.innerHTML = '';

    events = dayEvents;
    events.forEach(evt => {
      const li = document.createElement('li');
      li.className = 'modal-item';

      const label = evt.type === 'exam' ? '[지필고사]' : '[수행평가]';

      let imageHtml = '';
      if (evt.imageData) {
        imageHtml = `
          <div class="modal-img-container">
            <img src="${evt.imageData}" class="print-img-thumb" alt="수행 유인물" onclick="openLightbox('${evt.imageData}')">
            <div class="img-caption">🔍 사진을 터치하면 크게 확대됩니다.</div>
          </div>
        `;
      }

      const deleteButtonHtml = (currentUserRole === 'admin')
        ? `<button class="delete-btn" onclick="deleteSchedule(${evt.id})">삭제</button>`
        : '';

      li.innerHTML = `
        <div class="modal-item-header">
          <span class="modal-item-title">${label} ${evt.title}</span>
          ${deleteButtonHtml}
        </div>
        ${imageHtml}
      `;
      list.appendChild(li);
    });

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('active');
    selectedDateForModal = null;
  }

  function openLightbox(imgSrc) {
    const lightbox = document.getElementById('lightboxOverlay');
    const lightboxImg = document.getElementById('lightboxImg');
    lightboxImg.src = imgSrc;
    lightbox.classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightboxOverlay').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
  }

  updateAuthUI();
  renderCalendar();
</script>
</body>
</html>
