<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 학사 일정 & 프린트 캘린더 (비밀번호 모드 v2.0)</title>
  <style>
    :root {
      --exam-color: #e74c3c;
      --exam-bg: #fde8e8;
      --task-color: #2b7bc6;
      --task-bg: #e8f4fd;
      --primary: #4a90e2;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #edf0f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #333;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 16px;
    }

    /* 상단 권한 상태 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .user-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .user-badge.student { background-color: #e9ecef; color: #495057; }
    .user-badge.admin { background-color: #e3f2fd; color: #1976d2; }

    .auth-btn {
      background: none;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-btn:hover { background-color: #f1f3f5; }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 16px;
      color: #2c3e50;
    }

    /* 관리자 일정 등록 폼 */
    .form-box {
      display: none; /* 학생 모드에서는 숨김 */
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      flex-direction: column;
      gap: 8px;
    }

    .form-box.active { display: flex; /* 관리자 로그인 시 보임 */ }

    .form-row { display: flex; gap: 6px; }

    input, select, button {
      padding: 9px 10px;
      font-size: 0.9rem;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"], input[type="password"] { flex: 1; }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #555;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      padding: 10px;
      transition: background 0.2s;
    }

    button.btn-primary:hover { background: #357abd; }

    /* 달력 헤더 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .calendar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
    }

    .nav-btn {
      background: #eef2f7;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* 요일 그리드 */
    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-bottom: 6px;
    }

    .weekdays-grid div:first-child { color: #e74c3c; } /* 일요일 */
    .weekdays-grid div:last-child { color: #3498db; }  /* 토요일 */

    /* 달력 그리드 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }

    /* 칸 크기 고정 스타일 (76px 유지) */
    .day-cell {
      height: 76px;
      max-height: 76px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .day-cell:hover { background: #f4f8fc; }
    .day-cell.empty { border: none; background: transparent; cursor: default; }
    .day-cell.today { border-color: var(--primary); background-color: #f0f7ff; }

    .day-number {
      font-size: 0.72rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .event-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      scrollbar-width: none;
    }
    .event-container::-webkit-scrollbar { display: none; }

    /* 컴팩트 뱃지 (카메라 이모티콘 없이 표시) */
    .event-badge {
      font-size: 0.58rem;
      padding: 1px 3px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      display: block;
      flex-shrink: 0;
    }

    .event-badge.task {
      background: var(--task-bg);
      color: var(--task-color);
      border-left: 2.5px solid var(--task-color);
    }

    .event-badge.exam {
      background: var(--exam-bg);
      color: var(--exam-color);
      border-left: 2.5px solid var(--exam-color);
    }

    /* 하단 안내 범례 */
    .legend {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.8rem;
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 18px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .modal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 12px 0;
    }

    .modal-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .modal-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .print-img-thumb {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      margin-top: 6px;
      cursor: zoom-in;
      display: block;
      object-fit: cover;
    }

    .delete-btn {
      border: none;
      background: none;
      color: #aaa;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
    }
    .delete-btn:hover { color: var(--exam-color); }

    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 12px;
    }

    .lightbox-overlay.active { display: flex; }
    .lightbox-img { max-width: 95%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <span id="roleBadge" class="user-badge student">학생 모드</span>
    <button id="authBtn" class="auth-btn" onclick="openAuthModal()">관리자 로그인</button>
  </div>

  <h1>🗓️ 2학년 일정 & 프린트 캘린더</h1>

  <!-- 관리자 일정 등록 폼 -->
  <div class="form-box" id="adminFormBox">
    <div class="form-row">
      <select id="typeSelect">
        <option value="task">수행</option>
        <option value="exam">지필</option>
      </select>
      <input type="text" id="titleInput" placeholder="과목명 (예: 국어, 역사, 과학)">
    </div>
    <div class="form-row">
      <input type="date" id="dateInput" style="flex:1;">
    </div>
    <div class="file-input-wrapper">
      <span>📄 유인물:</span>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <button id="submitBtn" class="btn-primary" onclick="addSchedule()">일정 등록하기</button>
  </div>

  <!-- 달력 헤더 -->
  <div class="calendar-header">
    <button class="nav-btn" onclick="prevMonth()">◀</button>
    <h2 id="monthYearDisplay"></h2>
    <button class="nav-btn" onclick="nextMonth()">▶</button>
  </div>

  <div class="weekdays-grid">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>

  <div class="days-grid" id="daysContainer"></div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--task-color);"></span>
      <span>[수] 수행평가</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background: var(--exam-color);"></span>
      <span>[지] 지필고사</span>
    </div>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalDateTitle">상세 일정</h3>
    <ul class="modal-list" id="modalList"></ul>
    <button class="btn-primary" style="width:100%;" onclick="closeModal()">닫기</button>
  </div>
</div>

<!-- [확인 포인트] 관리자 비밀번호 인증 모달 (토큰 문구 완전히 제거됨) -->
<div class="modal-overlay" id="authModalOverlay" onclick="closeAuthModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3>🔒 관리자 로그인 (비밀번호 전용 v2.0)</h3>
    <p style="font-size:0.85rem; color:#666; margin:8px 0 12px;">
      회장/선생님 전용 비밀번호를 입력하세요.
    </p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력 (기본: class2026)">
      <button class="btn-primary" onclick="loginAdmin()">로그인</button>
      <button class="auth-btn" style="padding:8px;" onclick="closeAuthModal()">취소</button>
    </div>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" class="lightbox-img" src="" alt="유인물 확대">
</div>

<script>
  // ========================================================
  // 1. 관리자 비밀번호 설정 변수
  // ========================================================
  const ADMIN_PASSWORD = "class2026"; 
  const STORAGE_KEY = "class_calendar_schedules_pw_v2";

  // 기본 일정 데이터
  const defaultSchedules = [
    { id: 1, type: 'task', title: '역사', date: '2026-09-24', imageData: null },
    { id: 2, type: 'exam', title: '수학', date: '2026-09-30', imageData: null }
  ];

  let schedules = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultSchedules;
  let currentUserRole = sessionStorage.getItem('user_role') || 'student';

  let currentDate = new Date();
  let selectedDateForModal = null;

  // 권한에 따른 UI 업데이트
  function updateAuthUI() {
    const roleBadge = document.getElementById('roleBadge');
    const authBtn = document.getElementById('authBtn');
    const adminFormBox = document.getElementById('adminFormBox');

    if (currentUserRole === 'admin') {
      roleBadge.innerText = '👑 관리자 모드';
      roleBadge.className = 'user-badge admin';
      authBtn.innerText = '로그아웃';
      authBtn.onclick = logoutAdmin;
      adminFormBox.classList.add('active');
    } else {
      roleBadge.innerText = '👤 학생 모드';
      roleBadge.className = 'user-badge student';
      authBtn.innerText = '관리자 로그인';
      authBtn.onclick = openAuthModal;
      adminFormBox.classList.remove('active');
    }
  }

  function openAuthModal() {
    document.getElementById('adminPasswordInput').value = '';
    document.getElementById('authModalOverlay').classList.add('active');
  }

  function closeAuthModal(e) {
    if (e && e.target !== document.getElementById('authModalOverlay')) return;
    document.getElementById('authModalOverlay').classList.remove('active');
  }

  // 비밀번호 로그인 검증
  function loginAdmin() {
    const enteredPassword = document.getElementById('adminPasswordInput').value.trim();
    
    if (!enteredPassword) {
      alert('비밀번호를 입력해 주세요.');
      return;
    }

    if (enteredPassword === ADMIN_PASSWORD) {
      currentUserRole = 'admin';
      sessionStorage.setItem('user_role', 'admin');
      updateAuthUI();
      closeAuthModal();
      renderCalendar();
      alert('관리자(회장)로 로그인되었습니다.');
    } else {
      alert('비밀번호가 일치하지 않습니다. 다시 입력해 주세요.');
    }
  }

  function logoutAdmin() {
    currentUserRole = 'student';
    sessionStorage.removeItem('user_role');
    updateAuthUI();
    renderCalendar();
    alert('학생 모드로 전환되었습니다.');
  }

  // 달력 렌더링
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYearDisplay').innerText = `${year}년 ${month + 1}월`;

    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell empty';
      daysContainer.appendChild(emptyCell);
    }

    const todayStr = new Date().toISOString().split('T')[0];

    for (let day = 1; day <= totalDays; day++) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';

      const formattedMonth = String(month + 1).padStart(2, '0');
      const formattedDay = String(day).padStart(2, '0');
      const dateString = `${year}-${formattedMonth}-${formattedDay}`;

      if (dateString === todayStr) dayCell.classList.add('today');

      const dayNumber = document.createElement('div');
      dayNumber.className = 'day-number';
      dayNumber.innerText = day;
      dayCell.appendChild(dayNumber);

      const eventContainer = document.createElement('div');
      eventContainer.className = 'event-container';

      const dayEvents = schedules.filter(s => s.date === dateString);

      dayEvents.forEach(evt => {
        const badge = document.createElement('div');
        badge.className = `event-badge ${evt.type}`;
        const typePrefix = evt.type === 'exam' ? '[지]' : '[수]';
        badge.innerText = `${typePrefix} ${evt.title}`;
        eventContainer.appendChild(badge);
      });

      dayCell.appendChild(eventContainer);
      dayCell.onclick = () => openModal(dateString);
      daysContainer.appendChild(dayCell);
    }
  }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  // 이미지 압축
  function resizeImage(file, maxWidth, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function (event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function () {
        const elem = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        elem.width = width;
        elem.height = height;
        const ctx = elem.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(elem.toDataURL('image/jpeg', 0.6));
      };
    };
  }

  // 일정 등록
  function addSchedule() {
    if (currentUserRole !== 'admin') {
      alert('일정 등록 권한이 없습니다.');
      return;
    }

    const type = document.getElementById('typeSelect').value;
    const title = document.getElementById('titleInput').value.trim();
    const date = document.getElementById('dateInput').value;
    const imageFileInput = document.getElementById('imageInput');
    const imageFile = imageFileInput.files[0];

    if (!title || !date) {
      alert('과목명과 날짜를 입력해 주세요!');
      return;
    }

    const saveItem = (imageData) => {
      const newItem = {
        id: Date.now(),
        type: type,
        title: title,
        date: date,
        imageData: imageData
      };

      try {
        schedules.push(newItem);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
        renderCalendar();

        document.getElementById('titleInput').value = '';
        document.getElementById('dateInput').value = '';
        document.getElementById('imageInput').value = '';
        alert('일정이 등록되었습니다!');
      } catch (err) {
        alert('사진 용량이 너무 큽니다. 더 작은 사진을 사용해 주세요.');
        schedules.pop();
      }
    };

    if (imageFile) {
      resizeImage(imageFile, 600, (compressedBase64) => saveItem(compressedBase64));
    } else {
      saveItem(null);
    }
  }

  // 일정 삭제
  function deleteSchedule(id) {
    if (currentUserRole !== 'admin') {
      alert('삭제 권한이 없습니다.');
      return;
    }

    if (!confirm('정말 삭제하시겠습니까?')) return;

    schedules = schedules.filter(s => s.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
    renderCalendar();

    if (selectedDateForModal) {
      const remaining = schedules.filter(s => s.date === selectedDateForModal);
      if (remaining.length === 0) closeModal();
      else openModal(selectedDateForModal);
    }
  }

  // 상세 모달
  function openModal(dateString) {
    selectedDateForModal = dateString;
    const dayEvents = schedules.filter(s => s.date === dateString);
    if (!dayEvents || dayEvents.length === 0) return;

    document.getElementById('modalDateTitle').innerText = `${dateString} 일정 및 유인물`;
    const list = document.getElementById('modalList');
    list.innerHTML = '';

    dayEvents.forEach(evt => {
      const li = document.createElement('li');
      li.className = 'modal-item';
      const label = evt.type === 'exam' ? '[지필고사]' : '[수행평가]';
      const photoHtml = evt.imageData ? `<img src="${evt.imageData}" class="print-img-thumb" onclick="openLightbox('${evt.imageData}')">` : '';
      const delBtn = (currentUserRole === 'admin') ? `<button class="delete-btn" onclick="deleteSchedule(${evt.id})">삭제</button>` : '';

      li.innerHTML = `
        <div class="modal-item-header">
          <span><strong>${label}</strong> ${evt.title}</span>
          ${delBtn}
        </div>
        ${photoHtml}
      `;
      list.appendChild(li);
    });

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('active');
    selectedDateForModal = null;
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxOverlay').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightboxOverlay').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
  }

  // 초기 렌더링
  updateAuthUI();
  renderCalendar();
</script>
</body>
</html>
