<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 학사 일정 & 프린트 캘린더</title>
  <style>
    :root {
      --primary-blue: #1971c2;
      --task-badge-bg: #e7f5ff;
      --task-badge-text: #1971c2;
      --exam-badge-bg: #ffe3e3;
      --exam-badge-text: #e03131;
      --past-badge-bg: #f1f3f5;
      --past-badge-text: #868e96;
      --today-bg: #0f3d64;
      --sunday-color: #e03131;
      --border-color: #f1f3f5;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #212529;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }

    .user-badge {
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      background-color: #e9ecef;
      color: #495057;
    }
    .user-badge.admin {
      background-color: #e3f2fd;
      color: var(--primary-blue);
    }

    .auth-btn {
      background: none;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .form-box {
      display: none;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px;
      flex-direction: column;
      gap: 8px;
    }
    .form-box.active { display: flex; }
    .form-row { display: flex; gap: 6px; }

    input, select, textarea, button {
      padding: 8px 10px;
      font-size: 0.88rem;
      border: 1px solid #ced4da;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"], input[type="password"], input[type="time"] { flex: 1; }
    textarea { width: 100%; height: 50px; resize: none; }

    button.btn-primary {
      background: var(--primary-blue);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      padding: 10px;
    }
    button.btn-primary:disabled { background: #a0c4f1; cursor: not-allowed; }

    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
    }
    .calendar-nav h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      padding: 4px 8px;
      cursor: pointer;
      color: #495057;
    }

    .calendar-wrapper {
      padding: 0 8px 12px;
      border-bottom: 8px solid #f1f3f5;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.78rem;
      color: #868e96;
      padding-bottom: 6px;
    }
    .weekdays-grid div:first-child { color: var(--sunday-color); }
    .weekdays-grid div:last-child { color: var(--primary-blue); }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    /* 과목명이 들어가는 고정 높이 칸 (74px) */
    .day-cell {
      height: 74px;
      max-height: 74px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3px 2px;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      overflow: hidden;
      background: #ffffff;
      transition: border-color 0.15s;
    }

    .day-cell.other-month { opacity: 0.28; }
    .day-cell.selected { border-color: var(--primary-blue); }

    .day-header-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .day-number-wrap {
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
    }

    .day-number {
      font-size: 0.82rem;
      font-weight: 600;
      color: #212529;
    }

    .day-cell.sunday .day-number,
    .day-cell.holiday .day-number { color: var(--sunday-color); }
    .day-cell.saturday .day-number { color: var(--primary-blue); }

    /* 오늘 날짜 원형 강조 */
    .day-cell.today .day-number-wrap {
      background-color: var(--today-bg);
    }
    .day-cell.today .day-number {
      color: #ffffff !important;
    }

    .holiday-name {
      font-size: 0.55rem;
      color: var(--sunday-color);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 32px;
    }

    /* 달력 칸 내부 과목명 배지 목록 컨테이너 */
    .event-badge-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      scrollbar-width: none;
    }
    .event-badge-container::-webkit-scrollbar { display: none; }

    /* 과목명 배지 */
    .event-badge {
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
      text-align: center;
      display: block;
      flex-shrink: 0;
    }

    .event-badge.task {
      background: var(--task-badge-bg);
      color: var(--task-badge-text);
      border-left: 2px solid var(--primary-blue);
    }

    .event-badge.exam {
      background: var(--exam-badge-bg);
      color: var(--exam-badge-text);
      border-left: 2px solid var(--exam-badge-text);
    }

    .event-badge.past {
      background: var(--past-badge-bg) !important;
      color: var(--past-badge-text) !important;
      border-left-color: var(--past-badge-text) !important;
      text-decoration: line-through;
    }

    /* 하단 상세 카드 뷰 */
    .detail-section {
      padding: 18px 16px 30px;
      flex: 1;
      background: #ffffff;
    }

    .selected-sub-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-blue);
      margin-bottom: 4px;
    }

    .selected-date-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111;
      margin-bottom: 16px;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 0;
      color: #adb5bd;
      font-size: 0.9rem;
    }

    .event-card {
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 16px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .type-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--task-badge-bg);
      color: var(--task-badge-text);
    }
    .type-pill.exam {
      background: var(--exam-badge-bg);
      color: var(--exam-badge-text);
    }
    .type-pill.past {
      background: var(--past-badge-bg);
      color: var(--past-badge-text);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #495057;
      margin-bottom: 8px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .card-time {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: #868e96;
      font-weight: 500;
    }

    .card-images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .card-thumb {
      width: 100%;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      cursor: zoom-in;
    }

    .del-btn {
      background: none;
      border: none;
      color: #adb5bd;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .del-btn:hover { color: #e03131; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      padding: 18px;
    }

    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 12px;
    }
    .lightbox-overlay.active { display: flex; }
    .lightbox-img { max-width: 95%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="roleBadge" class="user-badge">학생 모드</span>
    <button id="authBtn" class="auth-btn" onclick="openAuthModal()">관리자 로그인</button>
  </div>

  <div class="form-box" id="adminFormBox">
    <div class="form-row">
      <select id="typeSelect">
        <option value="task">수행평가</option>
        <option value="exam">지필고사</option>
      </select>
      <input type="text" id="titleInput" placeholder="과목명 (예: 체육, 역사)">
    </div>
    <div class="form-row">
      <input type="date" id="dateInput" style="flex:1;">
      <input type="time" id="timeInput" value="22:00" style="width:110px;">
    </div>
    <textarea id="descInput" placeholder="세부 내용 (예: 배구, 야구 등)"></textarea>
    <div style="font-size:0.75rem; color:#666;">
      유인물 사진 (여러 장 선택 가능):
      <input type="file" id="imageInput" accept="image/*" multiple style="width:100%; margin-top:4px;">
    </div>
    <button id="submitBtn" class="btn-primary" onclick="addSchedule()">공용 서버에 등록하기</button>
  </div>

  <div class="calendar-nav">
    <button class="nav-btn" onclick="prevMonth()">◀</button>
    <h2 id="calendarMonthTitle"></h2>
    <button class="nav-btn" onclick="nextMonth()">▶</button>
  </div>

  <div class="calendar-wrapper">
    <div class="weekdays-grid">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="detail-section">
    <div class="selected-sub-title">선택한 날짜</div>
    <div class="selected-date-title" id="selectedDateHeader">날짜를 선택하세요</div>
    <div class="cards-container" id="cardsContainer"></div>
  </div>
</div>

<div class="modal-overlay" id="authModalOverlay" onclick="closeAuthModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 style="font-size:1rem; margin-bottom:8px;">🔒 관리자 로그인</h3>
    <p style="font-size:0.8rem; color:#666; margin-bottom:12px;">비밀번호를 입력하세요.</p>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력">
      <button class="btn-primary" onclick="loginAdmin()">로그인</button>
      <button class="auth-btn" style="padding:8px;" onclick="closeAuthModal()">취소</button>
    </div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" class="lightbox-img" src="" alt="유인물 확대">
</div>

<script>
  const ADMIN_PASSWORD = "class2026"; 
  const JSONBIN_BIN_ID = "6aa647f0ac6210605ac70149".trim(); 
  const JSONBIN_API_KEY = "$2a$10$xrkguaqza138TZqYTrcKJepPpeA75Th/u/DrugaWVhnBMctq4OQU6".trim(); 
  const IMGBB_API_KEY = "9911adee55b2aedaa911ca508dc35711".trim(); 

  const HOLIDAYS = {
    "2026-01-01": "신정",
    "2026-02-16": "설날",
    "2026-02-17": "설날",
    "2026-02-18": "설날",
    "2026-03-01": "삼일절",
    "2026-03-02": "대체공휴일",
    "2026-05-05": "어린이날",
    "2026-05-24": "부처님오신날",
    "2026-05-25": "대체공휴일",
    "2026-06-06": "현충일",
    "2026-08-15": "광복절",
    "2026-08-17": "대체공휴일",
    "2026-09-24": "추석",
    "2026-09-25": "추석",
    "2026-09-26": "추석",
    "2026-10-03": "개천절",
    "2026-10-05": "대체공휴일",
    "2026-10-09": "한글날",
    "2026-12-25": "크리스마스"
  };

  const WEEKDAY_NAMES = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

  let schedules = [];
  let currentUserRole = sessionStorage.getItem('user_role') || 'student';
  let currentDate = new Date();
  let selectedDateString = "";

  async function loadDataFromServer() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest?t=${Date.now()}`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      if (!res.ok) throw new Error(`HTTP 에러 ${res.status}`);

      const data = await res.json();
      schedules = Array.isArray(data.record) ? data.record : [];
      renderCalendar();
      renderSelectedDateDetails();
    } catch (e) {
      console.error("서버 데이터 로드 실패:", e);
    }
  }

  async function saveDataToServer(newSchedules) {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(newSchedules)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.message || `HTTP ${res.status}`);
      }

      schedules = newSchedules;
      renderCalendar();
      renderSelectedDateDetails();
      return true;
    } catch (e) {
      console.error("서버 저장 오류:", e);
      alert(`[서버 저장 실패]\n${e.message}`);
      return false;
    }
  }

  function optimizeImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const maxWidth = 650;
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
        };
      };
    });
  }

  async function uploadToImgBB(base64Data) {
    const formData = new FormData();
    formData.append("image", base64Data);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: "POST",
      body: formData
    });
    const resJson = await res.json();
    if (!resJson.success) throw new Error("사진 업로드 실패");
    return resJson.data.display_url;
  }

  async function addSchedule() {
    if (currentUserRole !== 'admin') return alert('권한이 없습니다.');

    const type = document.getElementById('typeSelect').value;
    const title = document.getElementById('titleInput').value.trim();
    const date = document.getElementById('dateInput').value;
    const time = document.getElementById('timeInput').value;
    const desc = document.getElementById('descInput').value.trim();
    const files = document.getElementById('imageInput').files;
    const submitBtn = document.getElementById('submitBtn');

    if (!title || !date) return alert('과목명과 날짜를 입력해 주세요.');

    submitBtn.disabled = true;

    try {
      const imageUrls = [];
      if (files && files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          submitBtn.innerText = `사진 업로드 중 (${i + 1}/${files.length})...`;
          const b64 = await optimizeImage(files[i]);
          const url = await uploadToImgBB(b64);
          imageUrls.push(url);
        }
      }

      submitBtn.innerText = "서버 기록 중...";
      const newItem = {
        id: Date.now(),
        type: type,
        title: title,
        date: date,
        time: time,
        description: desc,
        images: imageUrls
      };

      const updated = [...schedules, newItem];
      const ok = await saveDataToServer(updated);
      if (ok) {
        document.getElementById('titleInput').value = '';
        document.getElementById('descInput').value = '';
        document.getElementById('imageInput').value = '';
        alert('성공적으로 등록되었습니다.');
      }
    } catch (e) {
      alert(`등록 실패: ${e.message}`);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "공용 서버에 등록하기";
    }
  }

  async function deleteSchedule(id) {
    if (currentUserRole !== 'admin') return;
    if (!confirm('해당 일정을 삭제하시겠습니까?')) return;

    const updated = schedules.filter(s => s.id !== id);
    const ok = await saveDataToServer(updated);
    if (ok) alert('삭제되었습니다.');
  }

  // 상단 달력 그리드 (과목명 배지 렌더링)
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('calendarMonthTitle').innerText = `${year}년 ${month + 1}월`;

    const daysGrid = document.getElementById('daysGrid');
    daysGrid.innerHTML = '';

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    const prevMonthTotalDays = new Date(year, month, 0).getDate();

    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

    if (!selectedDateString) selectedDateString = todayStr;

    // 이전 달 날짜
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      const d = prevMonthTotalDays - i;
      const cell = document.createElement('div');
      cell.className = 'day-cell other-month';
      cell.innerHTML = `
        <div class="day-header-wrap">
          <div class="day-number-wrap"><span class="day-number">${d}</span></div>
        </div>
      `;
      daysGrid.appendChild(cell);
    }

    // 이번 달 날짜
    for (let day = 1; day <= totalDays; day++) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';

      const dayOfWeek = (firstDayIndex + day - 1) % 7;
      if (dayOfWeek === 0) dayCell.classList.add('sunday');
      if (dayOfWeek === 6) dayCell.classList.add('saturday');

      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      if (dateStr === todayStr) dayCell.classList.add('today');
      if (dateStr === selectedDateString) dayCell.classList.add('selected');

      const holiday = HOLIDAYS[dateStr];
      if (holiday) dayCell.classList.add('holiday');

      // 날짜 숫자 및 공휴일 표시
      let innerHtml = `
        <div class="day-header-wrap">
          <div class="day-number-wrap">
            <span class="day-number">${day}</span>
          </div>
          ${holiday ? `<span class="holiday-name">${holiday}</span>` : ''}
        </div>
      `;

      // 과목명 텍스트 배지 컨테이너
      const dayEvents = schedules.filter(s => s.date === dateStr);
      innerHtml += `<div class="event-badge-container">`;
      dayEvents.forEach(evt => {
        let badgeClass = evt.type === 'exam' ? 'exam' : 'task';
        if (evt.date < todayStr) badgeClass += ' past';
        innerHtml += `<span class="event-badge ${badgeClass}">${evt.title}</span>`;
      });
      innerHtml += `</div>`;

      dayCell.innerHTML = innerHtml;
      dayCell.onclick = () => selectDate(dateStr);
      daysGrid.appendChild(dayCell);
    }

    // 다음 달 날짜 채우기
    const totalRendered = firstDayIndex + totalDays;
    const remaining = (7 - (totalRendered % 7)) % 7;
    for (let j = 1; j <= remaining; j++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell other-month';
      cell.innerHTML = `
        <div class="day-header-wrap">
          <div class="day-number-wrap"><span class="day-number">${j}</span></div>
        </div>
      `;
      daysGrid.appendChild(cell);
    }
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }
  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  function selectDate(dateStr) {
    selectedDateString = dateStr;
    document.getElementById('dateInput').value = dateStr;
    renderCalendar();
    renderSelectedDateDetails();
  }

  // 하단 상세 일정 뷰
  function renderSelectedDateDetails() {
    if (!selectedDateString) return;

    const parts = selectedDateString.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    const dayOfWeekIndex = new Date(y, m - 1, d).getDay();

    const holiday = HOLIDAYS[selectedDateString] ? ` · ${HOLIDAYS[selectedDateString]}` : '';
    document.getElementById('selectedDateHeader').innerText = `${m}월 ${d}일 ${WEEKDAY_NAMES[dayOfWeekIndex]}${holiday}`;

    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

    const dayEvents = schedules.filter(s => s.date === selectedDateString);

    if (dayEvents.length === 0) {
      container.innerHTML = `<div class="empty-state">등록된 일정이 없습니다.</div>`;
      return;
    }

    dayEvents.forEach(evt => {
      const card = document.createElement('div');
      card.className = 'event-card';

      const isPast = evt.date < todayStr;
      let typeText = evt.type === 'exam' ? '지필고사' : '수행평가';
      let typeClass = evt.type === 'exam' ? 'exam' : '';
      if (isPast) {
        typeClass = 'past';
        typeText += ' (마감)';
      }

      const timeText = evt.time ? `🕒 ${evt.time}` : '🕒 시간 미지정';
      const descHtml = evt.description ? `<div class="card-desc">${evt.description}</div>` : '';

      let imagesHtml = '';
      const imageList = evt.images || (evt.imageData ? [evt.imageData] : []);
      if (imageList.length > 0) {
        imagesHtml = `<div class="card-images-grid">`;
        imageList.forEach(url => {
          imagesHtml += `<img src="${url}" class="card-thumb" loading="lazy" onclick="openLightbox('${url}')">`;
        });
        imagesHtml += `</div>`;
      }

      const delBtn = (currentUserRole === 'admin') 
        ? `<button class="del-btn" onclick="deleteSchedule(${evt.id})">삭제</button>` 
        : '';

      card.innerHTML = `
        <div class="card-top">
          <span class="type-pill ${typeClass}">${typeText}</span>
          ${delBtn}
        </div>
        <div class="card-title">${evt.title}</div>
        ${descHtml}
        <div class="card-time">${timeText}</div>
        ${imagesHtml}
      `;

      container.appendChild(card);
    });
  }

  function updateAuthUI() {
    const roleBadge = document.getElementById('roleBadge');
    const authBtn = document.getElementById('authBtn');
    const adminFormBox = document.getElementById('adminFormBox');

    if (currentUserRole === 'admin') {
      roleBadge.innerText = '👑 관리자 모드';
      roleBadge.className = 'user-badge admin';
      authBtn.innerText = '로그아웃';
      authBtn.onclick = logoutAdmin;
      adminFormBox.classList.add('active');
    } else {
      roleBadge.innerText = '학생 모드';
      roleBadge.className = 'user-badge';
      authBtn.innerText = '관리자 로그인';
      authBtn.onclick = openAuthModal;
      adminFormBox.classList.remove('active');
    }
  }

  function openAuthModal() {
    document.getElementById('adminPasswordInput').value = '';
    document.getElementById('authModalOverlay').classList.add('active');
  }

  function closeAuthModal(e) {
    if (e && e.target !== document.getElementById('authModalOverlay')) return;
    document.getElementById('authModalOverlay').classList.remove('active');
  }

  function loginAdmin() {
    const pwd = document.getElementById('adminPasswordInput').value.trim();
    if (pwd === ADMIN_PASSWORD) {
      currentUserRole = 'admin';
      sessionStorage.setItem('user_role', 'admin');
      updateAuthUI();
      closeAuthModal();
      renderSelectedDateDetails();
      alert('관리자로 로그인되었습니다.');
    } else {
      alert('비밀번호가 일치하지 않습니다.');
    }
  }

  function logoutAdmin() {
    currentUserRole = 'student';
    sessionStorage.removeItem('user_role');
    updateAuthUI();
    renderSelectedDateDetails();
    alert('학생 모드로 전환되었습니다.');
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxOverlay').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightboxOverlay').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
  }

  const today = new Date();
  selectedDateString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  document.getElementById('dateInput').value = selectedDateString;

  updateAuthUI();
  renderCalendar();
  renderSelectedDateDetails();
  loadDataFromServer();
</script>
</body>
</html>
